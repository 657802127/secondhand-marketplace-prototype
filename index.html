<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>闲置集市 · 二手交易小程序原型</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="stage">

  <!-- 评审辅助：页面直达 -->
  <aside class="quicknav">
    <div class="quicknav-head">
      <span class="quicknav-title">页面导航</span>
      <span class="quicknav-sub">点击直达</span>
    </div>
    <div class="quicknav-list">
      <button data-quick="home">首页 · 瀑布流</button>
      <button data-quick="search">搜索 / 分类</button>
      <button data-quick="detail">商品详情</button>
      <button data-quick="publish">发布闲置</button>
      <button data-quick="messages">消息列表</button>
      <button data-quick="chat">聊天会话</button>
      <button data-quick="profile">我的</button>
      <button data-quick="orders">我的订单</button>
      <button data-quick="list">我的收藏</button>
      <button data-quick="checkout">确认订单</button>
    </div>
    <div class="quicknav-foot">
      闲鱼黄 · 750rpx 设计稿<br />纯静态 · 离线可用
    </div>
  </aside>

  <div class="phone-wrap">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen">
        <div class="statusbar" id="statusbar">
          <span class="sb-time">9:41</span>
          <span class="sb-icons">
            <svg viewBox="0 0 18 12" width="17" height="11"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 10.6a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Zm0-4.6c1.3 0 2.5.5 3.4 1.3l1.1-1.2A6.9 6.9 0 0 0 8 4.4c-1.7 0-3.3.6-4.5 1.7l1.1 1.2A5 5 0 0 1 8 6Zm0-4C5.7 2 3.5 2.9 1.9 4.4l1.1 1.2A7.4 7.4 0 0 1 8 3.6c1.9 0 3.6.7 5 1.9l1.1-1.2A9.4 9.4 0 0 0 8 2Z"/></svg>
            <svg viewBox="0 0 26 12" width="26" height="12"><rect x="0.6" y="0.6" width="21" height="10.8" rx="3" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2.4" y="2.4" width="16" height="7.2" rx="1.6"/><path d="M23.4 4v4c1-.3 1.6-1 1.6-2s-.6-1.7-1.6-2Z" fill-opacity=".5"/></svg>
          </span>
        </div>

        <div class="app">
          <div class="pages" id="pages"></div>
          <nav class="tabbar hidden" id="tabbar"></nav>
        </div>

        <div class="overlay-root" id="overlayRoot"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
    <p class="caption">二手交易小程序 · 高保真交互原型</p>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/core.js"></script>
<script src="js/pages/trade.js"></script>
<script src="js/pages/user.js"></script>
<script src="js/main.js"></script>
</body>
</html>
